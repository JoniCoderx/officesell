<style id="s">
/* Layout: sales desk — sticky sale panel on the start side; ledger beside it: KPIs + scenario → categories → what sold → stock → log */
:root{
  --bg:#eef1f5; --surface:#ffffff; --fg:#151c27; --muted:#5b6677; --line:#dce1e9; --soft:#f5f7fa;
  --accent:#d98a10; --accent-ink:#3d2600; --accent-soft:#fcefd8;
  --ink:#1d2a3d; --ink-fg:#f3f6fa; --ink-muted:#a8b4c6; --ink-line:#33435a; --ink-field:#26364c;
  --good:#1d8657; --good-soft:#e0f3ea; --warn:#b4560d; --warn-soft:#fbe9da; --none:#6b7686; --none-soft:#e9edf2;
  --display:"Rubik","Assistant",system-ui,sans-serif; --body:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10141a; --surface:#181e27; --fg:#e6eaf0; --muted:#98a3b4; --line:#29313d; --soft:#1d2430;
  --accent:#f0a83a; --accent-ink:#1d1200; --accent-soft:#3a2a10;
  --ink:#0b0f15; --ink-fg:#eef2f7; --ink-muted:#8f9bae; --ink-line:#263040; --ink-field:#151c26;
  --good:#4cc790; --good-soft:#15322a; --warn:#f0965a; --warn-soft:#3a2416; --none:#98a3b4; --none-soft:#232a35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141a; --surface:#181e27; --fg:#e6eaf0; --muted:#98a3b4; --line:#29313d; --soft:#1d2430;
  --accent:#f0a83a; --accent-ink:#1d1200; --accent-soft:#3a2a10;
  --ink:#0b0f15; --ink-fg:#eef2f7; --ink-muted:#8f9bae; --ink-line:#263040; --ink-field:#151c26;
  --good:#4cc790; --good-soft:#15322a; --warn:#f0965a; --warn-soft:#3a2416; --none:#98a3b4; --none-soft:#232a35; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer;border-radius:8px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{direction:rtl;text-align:right;max-width:1360px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;align-items:start}
.shell.ro{grid-template-columns:minmax(0,1fr)}
@media (max-width:960px){.shell{grid-template-columns:minmax(0,1fr)}}
main{display:grid;gap:18px;min-width:0}

/* side panel */
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);background:var(--ink);color:var(--ink-fg);border-radius:14px;padding:18px;display:grid;gap:16px;max-height:calc(100vh - 32px);overflow:auto}
@media (max-width:960px){aside{position:static;max-height:none}}
aside h2{font-size:17px}
.lbl{font-size:12px;font-weight:700;color:var(--ink-muted);letter-spacing:.02em}
.field{display:grid;gap:5px}
.field input,.field select{font:inherit;color:var(--ink-fg);background:var(--ink-field);border:1px solid var(--ink-line);border-radius:8px;padding:9px 10px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:grid;grid-template-columns:36px minmax(0,1fr) 36px;gap:6px}
.stepper button{background:var(--ink-field);border:1px solid var(--ink-line);color:var(--ink-fg);font-size:18px;font-weight:700;padding:0}
.stepper input{text-align:center;padding-inline:4px}
.stockline{font-size:13px;color:var(--ink-muted);min-height:20px}
.stockline b{color:var(--ink-fg)}
.calc{background:var(--ink-field);border-radius:10px;padding:10px 12px;display:grid;gap:4px;font-size:13px;color:var(--ink-muted)}
.calc div{display:flex;justify-content:space-between;gap:8px}
.calc b{color:var(--ink-fg)}
.go{background:var(--accent);color:var(--accent-ink);border:0;padding:12px;font-weight:700;font-size:16px;width:100%}
.msg{font-size:13px;font-weight:700;min-height:18px}
.msg.bad{color:#ffb38a}.msg.ok{color:#7fe0b2}
.recent{display:grid;gap:2px}
.recent .r{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:13px;padding:7px 0;border-top:1px solid var(--ink-line)}
.recent .r span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.undo{background:none;border:0;color:var(--ink-muted);font-size:16px;padding:2px 6px}
.undo:hover{color:#ffb38a}
.undo.arm{background:#c45d16;color:#fff;font-size:12px;font-weight:700}

/* header */
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-size:clamp(24px,3.4vw,32px);font-weight:700;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--accent)}
.sub{color:var(--muted);font-size:14px}
.savebar{display:flex;align-items:center;gap:10px}
.state{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.state::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good)}
.state.dirty::before{background:var(--accent)}
.state.ro::before{background:var(--none)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;padding:7px 14px;font-weight:700;font-size:13px}

/* KPIs */
.kpis{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px}
@media (max-width:680px){.kpis{grid-template-columns:1fr 1fr}.kpis .main{grid-column:1/-1}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:2px;align-content:start;min-width:0}
.kpi .k{font-size:13px;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--display);font-size:clamp(22px,2.8vw,30px);font-weight:700;line-height:1.2}
.kpi .n2{font-size:13px;color:var(--muted)}
.kpi.main{background:var(--accent-soft);border-color:transparent}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.scn{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.scn label{font-weight:700;font-size:14px}
.scn input[type=range]{flex:1 1 180px;accent-color:var(--accent);min-width:0}
.scn .pct{display:flex;align-items:center;gap:4px}
.scn .pct input{font:inherit;width:62px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:4px;background:var(--soft);color:var(--fg)}
.scn .out{font-size:14px;color:var(--muted)}
.scn .out b{color:var(--fg);font-family:var(--display);font-size:17px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.phead h2{font-size:18px}
.note{font-size:12px;color:var(--muted)}

.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.cat{background:var(--soft);border-radius:10px;padding:12px;display:grid;gap:4px}
.cat h3{font-size:15px}
.cat .line{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.cat .line b{color:var(--fg)}
.mini{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.mini i{display:block;height:100%;background:var(--accent);transition:width .25s}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{font:inherit;border:1px solid var(--line);background:var(--soft);color:var(--fg);border-radius:8px;padding:6px 10px;width:200px;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--soft);border:1px solid var(--line);color:var(--muted);padding:4px 12px;font-size:13px;font-weight:600;border-radius:999px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 8px;text-align:right;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;background:var(--surface)}
td.n,th.n{text-align:right}
.stock{min-width:860px}
.sold{min-width:520px}
.log{min-width:680px}
tr.grp td{background:var(--soft);font-family:var(--display);font-weight:700;padding-block:8px}
tr.grp .ct{font-family:var(--body);font-weight:600;font-size:13px;color:var(--muted);margin-inline-start:8px}
.iname input{font:inherit;font-weight:600;color:var(--fg);background:transparent;border:1px solid transparent;border-radius:6px;padding:3px 6px;width:100%;min-width:190px}
.cell{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:78px;text-align:right;font-variant-numeric:tabular-nums}
.cell.w{width:96px}.cell.s{width:56px}
select.cell{text-align:right;width:auto;max-width:230px}
input[type=date].cell{width:auto;text-align:right}
.cell:hover,.iname input:hover{border-color:var(--muted)}
.cell:focus,.iname input:focus{border-color:var(--accent);background:var(--surface)}
.cell.missing{background:var(--accent-soft);border-color:transparent}
.cell::placeholder{color:var(--muted)}
.ro .cell,.ro .iname input{border-color:transparent;pointer-events:none;background:transparent}
.ro select.cell{appearance:none}
.flow{display:grid;gap:4px;min-width:150px}
.flow .t{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.flow .t b{color:var(--fg);font-size:15px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-all{background:var(--good-soft);color:var(--good)}
.p-part{background:var(--warn-soft);color:var(--warn)}
.p-none{background:var(--none-soft);color:var(--none)}
.p-miss{background:var(--accent-soft);color:var(--accent-ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .p-miss{color:var(--accent)}}
:root[data-theme="dark"] .p-miss{color:var(--accent)}
.up{color:var(--good);font-weight:700}.down{color:var(--warn);font-weight:700}
.err{color:var(--warn);font-weight:700;font-size:12px}
.acts{display:flex;gap:4px;justify-content:flex-end;align-items:center}
.sell{background:var(--accent-soft);color:var(--fg);border:0;font-size:12px;font-weight:700;padding:4px 10px}
.sell:hover{background:var(--accent);color:var(--accent-ink)}
.del{background:none;border:0;color:var(--muted);font-size:17px;line-height:1;padding:4px 8px}
.del:hover{color:var(--warn)}
.del.arm{color:#fff;background:var(--warn);font-size:12px;font-weight:700}
.ro .del,.ro .ghost,.ro .sell{display:none}
.ghost{background:transparent;border:1px dashed var(--line);color:var(--muted);padding:5px 12px;font-size:13px}
.ghost:hover{color:var(--fg);border-color:var(--muted)}
.seq{color:var(--muted)}
.empty{padding:18px;text-align:center;color:var(--muted)}
tr.flash td{animation:fl 1.2s ease-out}
@keyframes fl{from{background:var(--accent-soft)}to{background:transparent}}
@media (max-width:640px){
  input,select{font-size:16px!important}
  .shell{padding-block:14px 40px;gap:14px}
  h1{font-size:24px}
  header{align-items:flex-start}
  .kpi{padding:12px}
  .kpi .v{font-size:22px}
  .panel{padding:12px}
  .scn{padding:12px}
  .scn label{flex:1 1 100%}
  .search{width:100%}
  .tools{width:100%}
  .cats{grid-template-columns:1fr 1fr}
  .stock{min-width:760px}
}
@media (max-width:380px){.cats{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

    items.forEach(function(it){var c=calc(it);t.rev+=c.rev;t.leftVal+=c.leftVal;t.units+=c.q||0;t.sold+=c.s;t.left+=Math.max(c.left||0,0);t[c.status]++;});
    t.exp=t.rev+t.leftVal*pctS()/100; t.full=t.rev+t.leftVal; return t;
  }
  var PILL={miss:['p-miss','חסר מחיר/מלאי'],none:['p-none','לא נמכר'],part:['p-part','נמכר חלקית'],all:['p-all','נמכר הכל']};
  var FILTERS=[['all','הכל'],['none','לא נמכר'],['part','חלקית'],['allsold','נמכר הכל'],['miss','חסר נתונים']];
  function inFilter(it){var s=calc(it).status;return filter==='all'||(filter==='allsold'?s==='all':s===filter);}

  /* ---------- regions without inputs (safe to redraw any time) ---------- */
  function kpisHTML(){
    var T=totals(state.items),pct=T.exp>0?Math.round(T.rev/T.exp*100):0;
    return '<div class="kpi main"><span class="k">נמכר עד כה</span><span class="v num">'+money(T.rev)+'</span><div class="prog"><i style="width:'+Math.min(pct,100)+'%"></i></div><span class="n2 num">'+pct+'% מהצפוי · '+state.sales.length+' עסקאות · '+T.sold+' יחידות</span></div>'
      +'<div class="kpi"><span class="k">עוד במלאי (מחיר דרישה)</span><span class="v num">'+money(T.leftVal)+'</span><span class="n2 num">'+T.left+' יחידות'+(T.miss?' · '+T.miss+' פריטים בלי מחיר':'')+'</span></div>'
      +'<div class="kpi"><span class="k">צפוי בסוף</span><span class="v num">'+money(T.exp)+'</span><span class="n2 num">'+(pctS()===100?'אם הכל יימכר במחיר הדרישה':'אם השאר יימכר ב-'+pctS()+'% מהדרישה')+'</span></div>';
  }
  function catsHTML(){
    var h='';cats().forEach(function(c){var its=state.items.filter(function(i){return i.cat===c;});if(!its.length)return;var t=totals(its),p=t.full>0?Math.round(t.rev/t.full*100):0;
      h+='<div class="cat"><h3>'+esc(c)+'</h3><div class="line"><span>נמכר</span><b class="num">'+money(t.rev)+'</b></div><div class="line"><span>נשאר במלאי</span><b class="num">'+money(t.leftVal)+'</b></div><div class="line"><span>יחידות</span><span class="num">'+t.sold+' נמכרו · '+t.left+' נשארו</span></div><div class="mini"><i style="width:'+p+'%"></i></div></div>';});
    return h;
  }
  function soldHTML(){
    var rows=state.items.map(function(it){return {it:it,k:calc(it)};}).filter(function(r){return r.k.s>0;}).sort(function(a,b){return b.k.rev-a.k.rev;});
    if(!rows.length)return '<tr><td colspan="5" class="empty">עוד לא נמכר כלום.</td></tr>';
    var h='',T=totals(state.items);
    rows.forEach(function(r){var k=r.k,d=(k.p&&k.avg!==null)?Math.round((k.avg/k.p-1)*100):null;
      h+='<tr><td>'+esc(r.it.name)+'</td><td class="n num">'+k.s+'</td><td class="n num"><b>'+money(k.rev)+'</b></td><td class="n num">'+money(k.avg)+'</td><td class="n num">'+(d===null?'<span class="note">אין מחיר דרישה</span>':(d===0?'כמו הדרישה':'<span class="'+(d>0?'up':'down')+'">'+(d>0?'+':'')+d+'%</span>'))+'</td></tr>';});
    h+='<tr><td><b>סה״כ</b></td><td class="n num"><b>'+T.sold+'</b></td><td class="n num"><b>'+money(T.rev)+'</b></td><td></td><td></td></tr>';

  function optionsHTML(sel,withEmpty){
    var o=withEmpty?'<option value="">בחרו פריט…</option>':'';
    cats().forEach(function(c){var its=state.items.filter(function(i){return i.cat===c;});if(!its.length)return;o+='<optgroup label="'+esc(c)+'">';
      its.forEach(function(it){var k=calc(it);o+='<option value="'+esc(it.id)+'"'+(sel===it.id?' selected':'')+'>'+esc(it.name)+(withEmpty&&k.left!==null?' · '+Math.max(k.left,0)+' במלאי':'')+'</option>';});o+='</optgroup>';});

  function recentHTML(){
    var rec=state.sales.slice(-6).reverse(),h='<span class="lbl">מכירות אחרונות</span>';

    if(dirty)return '<span class="state dirty">שומר אוטומטית…</span><button class="btn" id="save">שמור עכשיו</button>';
    return '<span class="state">הכל שמור'+(state.updated?' · '+esc(state.updated):'')+'</span>';
  }

      h+='<div class="field"><span class="lbl">סכום שהתקבל ₪</span><input id="f-total" class="num" inputmode="decimal" placeholder="סה״כ" value="'+esc(form.total)+'"></div></div>';

    h+='<section class="panel"><div class="phead"><h2>לפי קטגוריה</h2></div><div class="cats" id="cats">'+catsHTML()+'</div></section>';
    h+='<section class="panel"><div class="phead"><h2>מה נמכר עד כה</h2><span class="note">ממוצע ליחידה מול מחיר הדרישה</span></div><div class="scroll"><table class="sold"><thead><tr><th>פריט</th><th class="n">יחידות</th><th class="n">התקבל</th><th class="n">ממוצע ליח׳</th><th class="n">מול דרישה</th></tr></thead><tbody id="soldb">'+soldHTML()+'</tbody></table></div></section>';

    h+='<section class="panel'+(readonly?' ro':'')+'"><div class="phead"><h2>מלאי ומחירים</h2><div class="tools"><input class="search" id="q" placeholder="חיפוש פריט…" value="'+esc(query)+'" aria-label="חיפוש פריט"><div class="chips">';
    FILTERS.forEach(function(f){h+='<button class="chip" data-filter="'+f[0]+'" aria-pressed="'+(filter===f[0])+'">'+f[1]+' <span class="num" id="fc-'+f[0]+'">'+(f[0]==='all'?state.items.length:(f[0]==='allsold'?T.all:T[f[0]]))+'</span></button>';});
    h+='</div></div></div><div class="scroll"><table class="stock"><thead><tr><th>פריט</th><th>נמכרו / מלאי ראשוני</th><th class="n">מחיר דרישה</th><th class="n">התקבל</th><th class="n">שווי שנותר</th><th>סטטוס</th><th></th></tr></thead><tbody>';
    var shown=0;
    C.forEach(function(c){
      var its=state.items.filter(function(i){return i.cat===c&&inFilter(i);});
      if(!its.length&&filter!=='all')return;
      h+='<tr class="grp" data-grp="'+esc(c)+'"><td colspan="7">'+esc(c)+'<span class="ct num" id="g-'+C.indexOf(c)+'"></span></td></tr>';
      its.forEach(function(it){shown++;var id=esc(it.id);
        h+='<tr data-item="'+id+'"'+(flashId===it.id?' class="flash"':'')+'><td class="iname"><input id="n-'+id+'" data-f="name" value="'+esc(it.name)+'" aria-label="שם פריט"'+ro+'>'+(it.note?'<div class="note">'+esc(it.note)+'</div>':'')+'</td>';
        h+='<td><div class="flow"><span class="t"><b class="num" id="o-s-'+id+'"></b> / <input class="cell s'+(it.qty==null?' missing':'')+'" id="q-'+id+'" data-f="qty" inputmode="numeric" placeholder="?" value="'+(it.qty==null?'':it.qty)+'" aria-label="מלאי ראשוני"'+ro+'><span class="num" id="o-l-'+id+'"></span></span><div class="mini"><i id="o-b-'+id+'"></i></div><span class="err" id="o-e-'+id+'" hidden>נמכרו יותר מהמלאי</span></div></td>';
        h+='<td class="n"><input class="cell'+(it.price==null?' missing':'')+'" id="p-'+id+'" data-f="price" inputmode="decimal" placeholder="₪ ?" value="'+(it.price==null?'':it.price)+'" aria-label="מחיר דרישה"'+ro+'></td>';
        h+='<td class="n num" id="o-r-'+id+'"></td><td class="n num" id="o-v-'+id+'"></td><td><span class="pill" id="o-p-'+id+'"></span></td>';
        h+='<td><div class="acts"><button class="sell" data-sell="'+id+'">מכירה</button><button class="del'+(armed==='i:'+it.id?' arm':'')+'" data-del="'+id+'" aria-label="מחק פריט">'+(armed==='i:'+it.id?'למחוק?':'×')+'</button></div></td></tr>';});
      if(filter==='all')h+='<tr><td colspan="7"><button class="ghost" data-add="'+esc(c)+'">+ פריט ל'+esc(c)+'</button></td></tr>';
    });

    h+='</tbody></table></div><p class="note">כל שדה ניתן לעריכה, והחישובים מתעדכנים תוך כדי הקלדה. "נמכרו" מגיע מיומן המכירות.</p></section>';

    h+='<section class="panel'+(readonly?' ro':'')+'"><div class="phead"><h2>יומן מכירות</h2><span class="note num" id="logsum"></span></div><div class="scroll"><table class="log"><thead><tr><th>#</th><th>פריט</th><th class="n">כמות</th><th class="n">ליחידה ₪</th><th class="n">סה״כ ₪</th><th>תאריך</th><th></th></tr></thead><tbody>';
    if(!state.sales.length)h+='<tr><td colspan="7" class="empty">עדיין לא נרשמו מכירות.</td></tr>';
    state.sales.slice().reverse().forEach(function(x,i){var id=esc(x.id),q=num(x.qty)||0,pr=num(x.price)||0;
      h+='<tr data-sale="'+id+'"'+(flashId===x.id?' class="flash"':'')+'><td class="seq num">'+(state.sales.length-i)+'</td>';
      h+='<td><select class="cell" id="si-'+id+'" data-sf="item" aria-label="פריט"'+dis+'>'+optionsHTML(x.item,false)+(item(x.item)?'':'<option selected>פריט שנמחק</option>')+'</select></td>';
      h+='<td class="n"><input class="cell s" id="sq-'+id+'" data-sf="qty" inputmode="numeric" value="'+esc(x.qty)+'" aria-label="כמות"'+ro+'></td>';
      h+='<td class="n"><input class="cell" id="sp-'+id+'" data-sf="unit" inputmode="decimal" value="'+r2(pr)+'" aria-label="מחיר ליחידה"'+ro+'></td>';
      h+='<td class="n"><input class="cell w" id="st-'+id+'" data-sf="total" inputmode="decimal" value="'+r2(q*pr)+'" aria-label="סה״כ"'+ro+'></td>';
      h+='<td><input class="cell" type="date" id="sd-'+id+'" data-sf="date" value="'+esc(x.date)+'" aria-label="תאריך"'+ro+'></td>';
      h+='<td><button class="del'+(armed==='s:'+x.id?' arm':'')+'" data-delsale="'+id+'" aria-label="בטל מכירה">'+(armed==='s:'+x.id?'לבטל?':'×')+'</button></td></tr>';});
    h+='</tbody></table></div></section></main>';
    app.innerHTML=h;
    flashId=null;
    refresh(true);
    if(foc){var el=$(foc);if(el&&el.focus)el.focus();}
  }

  /* ---------- live refresh: numbers only, inputs untouched ---------- */
  function refresh(skipRegions){
    if(!skipRegions){$('kpis').innerHTML=kpisHTML();$('cats').innerHTML=catsHTML();$('soldb').innerHTML=soldHTML();var rc=$('recent');if(rc)rc.innerHTML=recentHTML();}
    var T=totals(state.items);
    state.items.forEach(function(it){var id=it.id;if(!$('o-s-'+id))return;var k=calc(it),pl=PILL[k.status];
      setT('o-s-'+id,k.s);setT('o-l-'+id,' · נשארו '+(k.left===null?'?':Math.max(k.left,0)));
      $('o-b-'+id).style.width=(k.q?Math.min(100,Math.round(k.s/k.q*100)):0)+'%';
      $('o-e-'+id).hidden=!k.over;
      setT('o-r-'+id,k.rev?money(k.rev):'–');setT('o-v-'+id,k.missing?'–':money(k.leftVal));
      var p=$('o-p-'+id);p.className='pill '+pl[0];setT('o-p-'+id,pl[1]);
      $('q-'+id).classList.toggle('missing',k.q===null);$('p-'+id).classList.toggle('missing',k.p===null);});
    cats().forEach(function(c,ci){var g=$('g-'+ci);if(!g)return;var t=totals(state.items.filter(function(i){return i.cat===c;}));g.textContent=money(t.rev)+' נמכר · '+money(t.leftVal)+' נשאר';});
    FILTERS.forEach(function(f){setT('fc-'+f[0],f[0]==='all'?state.items.length:(f[0]==='allsold'?T.all:T[f[0]]));});
    setT('logsum',state.sales.length+' עסקאות · '+money(T.rev));
    var so=$('scn-out');if(so)so.innerHTML='שווי השאר: <b class="num">'+money(T.leftVal*pctS()/100)+'</b> · סה״כ בסוף: <b class="num">'+money(T.exp)+'</b>';
    var fi=$('f-item');if(fi&&document.activeElement!==fi)fi.innerHTML=optionsHTML(form.item,true);
    panelCalc();
    if(!skipRegions)$('st').innerHTML=statusHTML();
  }
  function panelCalc(){
    var it=item(form.item),q=num(form.qty)||0,st=$('f-stock'),c=$('f-calc');if(!st||!c)return;
    if(it){var k=calc(it);st.innerHTML=(k.left!==null?'במלאי: <b class="num">'+Math.max(k.left,0)+'</b>':'מלאי לא ידוע')+(k.p!==null?' · דרישה '+money(k.p)+' ליח׳':'');}else st.textContent='';
    if(it&&!form.touched&&it.price!=null){form.total=String(q*it.price);var ti=$('f-total');if(ti&&document.activeElement!==ti)ti.value=form.total;}
    var tot=num(form.total),unit=(tot!==null&&q>0)?tot/q:null,d=(it&&it.price&&unit!==null)?Math.round((unit/it.price-1)*100):null;
    c.innerHTML='<div><span>מחיר ליחידה</span><b class="num">'+(unit===null?'–':money(unit))+'</b></div>'+(d!==null&&d!==0?'<div><span>מול מחיר הדרישה</span><b class="num '+(d>0?'up':'down')+'">'+(d>0?'+':'')+d+'%</b></div>':'');
  }

  /* ---------- saving: auto, after the user pauses ---------- */
  function touch(){dirty=true;$('st').innerHTML=statusHTML();schedule(1200);}
  function schedule(ms){clearTimeout(saveTimer);saveTimer=setTimeout(function(){var a=document.activeElement;if(a&&a!==document.body&&app.contains(a)&&/INPUT|SELECT/.test(a.tagName)&&a.type!=='range'){schedule(1500);return;}save();},ms);}
  function page(){
    var reset=(document.head.querySelector('style')||{}).textContent||'';
    var parts=['title','meta[name="claude:viewport-fit-sides"]','link[rel="stylesheet"]','#s'].map(function(sel){var el=document.querySelector(sel);return el?el.outerHTML:'';}).join('\n');
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
      +parts+'\n<div id="app" class="shell" dir="rtl" lang="he"></div>\n<script type="application/json" id="data">'+JSON.stringify(state).replace(/</g,'\\u003c')+'<\/script>\n'
      +$('main').outerHTML+'</body></html>';
  }
  function save(){
    clearTimeout(saveTimer);
    if(!dirty||saving||readonly)return;
    if(!ns){$('st').innerHTML='<span class="state dirty">השמירה לא זמינה בתצוגה הזו</span>';return;}
    var d=new Date();state.updated=d.toLocaleDateString('he-IL')+' '+d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
    saving=true;$('st').innerHTML=statusHTML();
    try{sessionStorage.setItem('officesell-pending',JSON.stringify(state));}catch(e){}
    ns.publish(page()).then(function(){saving=false;dirty=false;try{sessionStorage.removeItem('officesell-pending');}catch(e){}}).catch(function(err){saving=false;var c=err&&err.code;
      if(['not_writer','not_granted','consent_required','capability_disabled','not_declared'].indexOf(c)>=0){readonly=true;dirty=false;render();}
      else if(c==='conflict'){$('st').innerHTML='<span class="state dirty">מישהו אחר שמר בינתיים, הדף נטען מחדש</span>';}
      else if(c==='rate_limited'){schedule(8000);$('st').innerHTML=statusHTML();}
      else{$('st').innerHTML='<span class="state dirty">השמירה נכשלה</span><button class="btn" id="save">נסה שוב</button>';}});
  }

  /* ---------- events ---------- */
  app.addEventListener('input',function(e){var el=e.target;
    if(el.id==='f-qty'){form.qty=el.value;panelCalc();return;}
    if(el.id==='f-total'){form.total=el.value;form.touched=el.value!=='';panelCalc();return;}
    if(el.id==='f-date'){form.date=el.value;return;}
    if(el.id==='q'){query=el.value.trim();applySearch();return;}
    if(el.id==='scn'||el.id==='scn-r'){var v=num(el.value);if(v===null)return;state.scenario=v;var o=$(el.id==='scn'?'scn-r':'scn');if(o)o.value=v;refresh();touch();return;}
    var tr=el.closest('tr');if(!tr)return;
    if(el.dataset.f&&tr.dataset.item){var it=item(tr.dataset.item);if(!it)return;
      if(el.dataset.f==='name'){it.name=el.value;}else{var n=num(el.value);if(el.value.trim()===''){it[el.dataset.f]=null;}else if(n!==null){it[el.dataset.f]=n;}else return;}
      refresh();touch();return;}
    if(el.dataset.sf&&tr.dataset.sale){var x=sale(tr.dataset.sale);if(!x)return;var f=el.dataset.sf;
      if(f==='date'){x.date=el.value;}
      else if(f==='qty'){var qn=num(el.value);if(qn===null)return;x.qty=qn;$('st-'+x.id).value=r2(qn*(num(x.price)||0));}
      else if(f==='unit'){var un=num(el.value);if(un===null)return;x.price=un;$('st-'+x.id).value=r2((num(x.qty)||0)*un);}
      else if(f==='total'){var tn=num(el.value),qq=num(x.qty)||0;if(tn===null||qq<=0)return;x.price=r2(tn/qq);$('sp-'+x.id).value=x.price;}
      refresh();touch();}
  });
  app.addEventListener('change',function(e){var el=e.target;
    if(el.id==='f-item'){form.item=el.value;form.touched=false;panelCalc();return;}
    if(el.dataset.sf==='item'){var x=sale(el.closest('tr').dataset.sale);if(x){x.item=el.value;refresh();touch();}return;}
    if(el.dataset.f==='name'||el.dataset.f){var fi=$('f-item');if(fi)fi.innerHTML=optionsHTML(form.item,true);}
  });
  app.addEventListener('focusout',function(e){if(dirty&&/INPUT|SELECT/.test(e.target.tagName))schedule(900);});
  app.addEventListener('keydown',function(e){var t=e.target;if(e.key==='Enter'&&t.tagName==='INPUT'&&!t.closest('form')){e.preventDefault();t.blur();}});
  app.addEventListener('submit',function(e){e.preventDefault();
    var q=num(form.qty),tot=num(form.total),m=$('f-msg');
    function bad(t){m.textContent=t;m.className='msg bad';}
    if(!form.item)return bad('בחרו פריט');if(!q||q<=0)return bad('הזינו כמות');if(tot===null)return bad('הזינו את הסכום שהתקבל');
    var id='s'+Date.now().toString(36);
    state.sales.push({id:id,item:form.item,qty:q,price:r2(tot/q),date:form.date||''});
    flashId=id;form={item:'',qty:1,total:'',touched:false,date:form.date||today()};
    dirty=true;render();var mm=$('f-msg');if(mm){mm.textContent='נרשם ✓';mm.className='msg ok';}schedule(600);
  });
  app.addEventListener('click',function(e){var t=e.target;
    var step=t.closest('[data-step]'),fl=t.closest('[data-filter]'),add=t.closest('[data-add]'),del=t.closest('[data-del]'),ds=t.closest('[data-delsale]'),sell=t.closest('[data-sell]');
    if(step){var q=Math.max(1,(num(form.qty)||0)+Number(step.dataset.step));form.qty=q;$('f-qty').value=q;panelCalc();return;}
    if(sell){form.item=sell.dataset.sell;form.qty=1;form.touched=false;var fi=$('f-item');fi.value=form.item;panelCalc();var as=document.querySelector('aside');if(as&&as.scrollIntoView)as.scrollIntoView({behavior:'smooth',block:'start'});var ft=$('f-total');if(ft){ft.focus();ft.select();}return;}
    if(fl){filter=fl.dataset.filter;render();return;}
    if(add){var id='x'+Date.now().toString(36);state.items.push({id:id,cat:add.dataset.add,name:'פריט חדש',qty:null,price:null,note:''});render();var n=$('n-'+id);if(n){n.focus();n.select();}touch();return;}
    if(del){var d=del.dataset.del;if(armed==='i:'+d){state.items=state.items.filter(function(i){return i.id!==d;});state.sales=state.sales.filter(function(x){return x.item!==d;});armed=null;render();touch();}else{armed='i:'+d;render();}return;}
    if(ds){var s=ds.dataset.delsale;if(armed==='s:'+s){state.sales=state.sales.filter(function(x){return x.id!==s;});armed=null;render();touch();}else{armed='s:'+s;render();}return;}
    if(armed){armed=null;render();}
    if(t.closest('#save'))save();
  });
  function applySearch(){var q=query.toLowerCase();document.querySelectorAll('tr[data-item]').forEach(function(tr){var it=item(tr.dataset.item);tr.hidden=!!q&&!(it&&it.name.toLowerCase().indexOf(q)>=0);});}
  window.addEventListener('beforeunload',function(e){if(dirty&&!saving&&!readonly){e.preventDefault();e.returnValue='';}});

  render();
  if(window.claude&&claude.use){claude.use('artifact').then(function(x){ns=x;if(!x){readonly=true;render();}}).catch(function(){readonly=true;render();});}
  else{readonly=true;render();}
})();
</script>

</body>
</html>
